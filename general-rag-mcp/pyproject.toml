[tool.uv]
prerelease = "allow"
# 无包目录（package=false, virtual 模式）：MCP 是脚本 + tools/ 目录运行方式，
# 不发布为 Python 包——不设则 hatchling 无法推断 files-to-ship，uv sync 直接失败。
package = false

[project]
name = "general-rag-mcp"
version = "0.1.0"
description = "General RAG 知识库检索 MCP — 检索问答 / namespace / 健康探测 / 文件摄入"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.0b1",
    "httpx>=0.27,<1.0",
    "structlog>=24.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-prometheus",
    "prometheus-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# pytest-asyncio 1.x 默认 strict 模式：async fixture/测试无事件循环工厂全量报错
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
