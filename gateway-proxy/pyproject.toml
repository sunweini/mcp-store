[tool.uv]
prerelease = "allow"

[project]
name = "gateway-proxy"
version = "0.1.0"
description = "MCP Gateway Proxy - aggregates backend MCP servers with token auth + permissions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.0b1",
    "httpx>=0.27,<1.0",
    "redis>=5.0",
    "structlog>=24.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-prometheus",
    "aiomysql>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
