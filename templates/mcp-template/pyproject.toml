[tool.uv]
prerelease = "allow"

[project]
name = "{{mcp-name}}"
version = "0.1.0"
description = "{{MCP_DESCRIPTION}}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
