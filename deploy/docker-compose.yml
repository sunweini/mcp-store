# MCP Gateway 四容器编排
# 用法: cd deploy && cp config/*.env.example config/*.env && 编辑真实值 && docker compose up -d
#
# 端口策略:
#   - gateway-proxy 8082 -> 宿主 8082(避开 8080 本地开发端口)
#   - gateway-proxy 9465 -> 宿主 9465(metrics,避开 9464 本地默认)
#   - gateway-admin 8081 -> 宿主 8081
#   - zabbix-mcp / redis 不映射宿主端口(仅容器内网互访,减少攻击面)
#   - 搜索 MCP metrics: 9466/9467/9468 -> 容器内 9464
#     (tavily/brave/serpapi;宿主端避开 proxy 的 9465)
#   - aliyun-dns-mcp metrics: 9469 -> 容器内 9464 (避开上面 9466-9468)
#   - 搜索 MCP 的 MCP 端口 9050/9051/9052 不映射宿主(仅容器内网互访)
#
# 服务间互访: 用容器名 + 容器内端口(redis:6379, zabbix-mcp:9053, gateway-proxy:9465)
#
# 路径约定: build 上下文用 ../ 指向仓库根的源码目录;
#           env_file / volumes 用 ./ 指向 deploy/ 内的运行时配置和数据

services:
  redis:
    image: redis:7-alpine
    # 60s 内至少 1 次 key 变化才触发 RDB 持久化;warning 级别减少日志噪声
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./data/redis:/data
    networks: [mcp-net]
    restart: unless-stopped

  # MySQL 审计库：tools/call 全量记录（calls 表），dashboard 聚合统计的数据源
  # 容器内 3306 不映射宿主（与 redis 同模式，仅容器内网互访）
  # init SQL 由镜像首启自动执行；数据持久化到 ./data/mysql/
  mysql:
    image: mysql:8.0
    env_file:
      - ./config/mysql.env
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql-init:/docker-entrypoint-initdb.d:ro
    networks: [mcp-net]
    healthcheck:
      # CMD-SHELL + $$ 让容器内 shell 从 env_file 注入的环境解析密码;
      # compose 的 $VAR 插值不读 env_file,用 $$ 转义避免被 compose 清空
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway-proxy:
    build: ../gateway-proxy
    ports:
      - "8082:8082"
      - "9465:9465"
    env_file:
      - ./config/proxy.env
    environment:
      # 容器名互访: redis 服务名即 DNS 名
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PORT: "8082"
      GATEWAY_HOST: "0.0.0.0"
      PROMETHEUS_PORT: "9465"
      # 日志写挂载卷,宿主可直接查看 ./logs/proxy/
      LOG_FILE: /app/logs/gateway-proxy.log
    volumes:
      - ./logs/proxy:/app/logs
    networks: [mcp-net]
    depends_on: [redis]
    restart: unless-stopped

  gateway-admin:
    build: ../gateway-admin
    ports:
      - "8081:8081"
    env_file:
      - ./config/admin.env
      # SEARCH_PROXY 在此定义(见 proxy.env.example):admin 探活 brave key
      # 时走同一代理。不写在 environment——compose 中 environment 优先级
      # 高于 env_file,${SEARCH_PROXY:-} 空串会覆盖 proxy.env 的真实值
      - ./config/proxy.env
      # MYSQL_URL 在 mysql.env 里（直接写好完整连接串，避免 compose
      # environment 不从 env_file 插值 $MYSQL_PASSWORD 的问题）；
      # 审计异步化后仅 admin 消费者需要 MySQL，proxy 不读
      - ./config/mysql.env
    environment:
      REDIS_URL: redis://redis:6379/0
      # 容器名互访: admin 通过 proxy 的 metrics 端口拉取 Prometheus 数据
      GATEWAY_PROXY_METRICS_URL: http://gateway-proxy:9465/metrics
      LOG_FILE: /app/logs/gateway-admin.log
    volumes:
      - ./logs/admin:/app/logs
    networks: [mcp-net]
    depends_on: [redis, gateway-proxy]
    # deploy.sh 用 `up -d --wait` 等 healthy;此 healthcheck 让 admin 就绪可被 init.sh 调用
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  zabbix-mcp:
    build: ../zabbix-mcp
    env_file:
      - ./config/zabbix.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9053"
      LOG_FORMAT: json
      LOG_FILE: /app/logs/zabbix-mcp.log
    volumes:
      - ./logs/zabbix-mcp:/app/logs
    networks: [mcp-net]
    # zabbix-mcp 依赖 Redis 做 token 验证(proxy 转发请求时校验)
    depends_on: [redis]
    restart: unless-stopped

  # 三个搜索 MCP:容器内端口 9050/9051/9052,不映射宿主 MCP 端口
  # (仅容器内网互访);metrics 端口各自映射到宿主 9466/9467/9468
  # (容器内统一 9464,宿主端避开 gateway-proxy 的 9465)
  # 无 key env——API key 由 gateway-admin 写入 Redis(keys.py),MCP 启动时从 KeyPool 读取;
  # 仅 brave-mcp 用 env_file 注入 SEARCH_PROXY(出网代理,见下)
  tavily-mcp:
    build: ../tavily-mcp
    ports:
      - "9466:9464"
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9050"
      LOG_FORMAT: json
      LOG_FILE: /app/logs/tavily-mcp.log
      TAVILY_QUOTA_DEFAULT: "1000"
      PROMETHEUS_PORT: "9464"
    volumes:
      - ./logs/tavily-mcp:/app/logs
    networks: [mcp-net]
    depends_on: [redis]
    restart: unless-stopped

  brave-mcp:
    build: ../brave-mcp
    ports:
      - "9467:9464"
    # SEARCH_PROXY 在此定义(见 proxy.env.example)——生产网络
    # api.search.brave.com 直连不通,必须走内网代理(tavily/serpapi 直连
    # 通,无需此变量)。不写在 environment——compose 中 environment 优先级
    # 高于 env_file,${SEARCH_PROXY:-} 空串会覆盖 proxy.env 的真实值
    env_file:
      - ./config/proxy.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9051"
      LOG_FORMAT: json
      LOG_FILE: /app/logs/brave-mcp.log
      BRAVE_QUOTA_DEFAULT: "2000"
      PROMETHEUS_PORT: "9464"
    volumes:
      - ./logs/brave-mcp:/app/logs
    networks: [mcp-net]
    depends_on: [redis]
    restart: unless-stopped

  serpapi-mcp:
    build: ../serpapi-mcp
    ports:
      - "9468:9464"
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9052"
      LOG_FORMAT: json
      LOG_FILE: /app/logs/serpapi-mcp.log
      SERPAPI_QUOTA_DEFAULT: "100"
      PROMETHEUS_PORT: "9464"
    volumes:
      - ./logs/serpapi-mcp:/app/logs
    networks: [mcp-net]
    depends_on: [redis]
    restart: unless-stopped

  # 阿里云 DNS 管理 MCP：容器内 9054 不映射宿主（仅容器内网互访）；
  # metrics 9469 -> 容器内 9464（宿主端避开 proxy 9465 / 搜索 MCP 9466-9468）
  # 无凭证 env——账户 AccessKey 由 gateway-admin「阿里云 DNS」页写入 Redis
  aliyun-dns-mcp:
    build: ../aliyun-dns-mcp
    ports:
      - "9469:9464"
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9054"
      LOG_FORMAT: json
      LOG_FILE: /app/logs/aliyun-dns-mcp.log
      PROMETHEUS_PORT: "9464"
    volumes:
      - ./logs/aliyun-dns-mcp:/app/logs
    networks: [mcp-net]
    depends_on: [redis]
    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge
