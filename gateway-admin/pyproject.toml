[tool.uv]
prerelease = "allow"

[project]
name = "gateway-admin"
version = "0.1.0"
description = "MCP Gateway Admin - management API + Vue 3 UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.20",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
